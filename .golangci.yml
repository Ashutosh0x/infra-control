run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gocritic
    - gofumpt
    - revive
    - misspell
    - prealloc

linters-settings:
  govet:
    check-shadowing: true
  gofumpt:
    extra-rules: true
