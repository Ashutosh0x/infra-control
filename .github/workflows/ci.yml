name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref; only the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The UI layer branches on platform for terminal handling, so all three
        # are built. Windows in particular exercises the console mode path that
        # no other OS reaches.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || (echo "go.mod or go.sum is not tidy; run 'go mod tidy'" && exit 1)

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # The preview-tagged commands are excluded from default builds, so
      # nothing else would catch them breaking.
      - name: Build with preview commands
        run: go build -tags preview ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -shuffle=on ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The spinner runs on its own goroutine and shares the renderer's writer
      # with the calling command, so concurrent access is a real risk here.
      - name: Test with race detector
        run: go test -race -shuffle=on ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report
        run: go tool cover -func=coverage.out | tail -30

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the CLI
        run: go build -o infractl ./cmd/infractl

      # These assertions cover the contract the README documents: the exit code
      # split, machine-readable output staying parseable, and secrets never
      # reaching the payload.
      - name: Demo runs with no setup
        run: |
          # The demo drives the real code path against embedded fixtures, so
          # it breaking means the pipeline broke, not just the demo.
          ./infractl demo > demo.txt 2>&1
          grep -q 'aws_s3_bucket.assets' demo.txt || {
            echo 'demo did not report the seeded drift'; cat demo.txt; exit 1; }
          grep -q 'affects 3 resources' demo.txt || {
            echo 'demo did not report blast radius'; cat demo.txt; exit 1; }

      - name: Snapshot extraction from a refresh-only plan
        run: |
          ./infractl snapshot from-plan testdata/refresh-plan.json --out extracted.json --quiet

          # Five managed resources across the root and a child module; the
          # data source must be excluded.
          count=$(jq '.resources | length' extracted.json)
          test "$count" -eq 5 || { echo "expected 5 resources, got $count"; exit 1; }
          jq -e '.resources | has("module.vpc.aws_route_table.rt")' extracted.json > /dev/null
          jq -e '.resources | has("data.aws_caller_identity.current") | not' extracted.json > /dev/null

          # The extracted snapshot must drive a real scan.
          ./infractl drift scan --state testdata/terraform.tfstate --live extracted.json --no-ignore -o json | jq -e '.findings | length > 0' > /dev/null

      - name: Doctor exits non-zero on a stale snapshot
        run: |
          jq '.captured_at = "2020-01-01T00:00:00Z"' testdata/live.json > stale.json
          set +e
          ./infractl doctor --state testdata/terraform.tfstate --live stale.json > doctor.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 4 || { echo "expected exit 4, got $code"; cat doctor.txt; exit 1; }

      - name: Remediation output runs nothing
        run: |
          ./infractl drift scan --state testdata/terraform.tfstate --live testdata/live.json --no-ignore --emit-import imports.tf --quiet -o json > /dev/null
          grep -q '^import {' imports.tf || { echo 'no import block emitted'; cat imports.tf; exit 1; }
          grep -q 'aws_security_group.orphan' imports.tf || { echo 'wrong resource imported'; exit 1; }

      - name: Notify reports only what changed
        run: |
          rm -rf notifytest && mkdir notifytest
          cp testdata/terraform.tfstate testdata/live.json notifytest/
          cd notifytest

          # First run: every finding is new.
          ../infractl notify --state terraform.tfstate --live live.json -o json > first.json
          new=$(jq '[.events[] | select(.kind == "new")] | length' first.json)
          test "$new" -eq 4 || { echo "expected 4 new events, got $new"; exit 1; }

          # Only the critical security finding pages.
          jq -e '[.events[] | select(.tier == "page")] | length == 1' first.json > /dev/null

          # Second run over identical input: nothing is new. This is the
          # property the whole layer exists for.
          ../infractl notify --state terraform.tfstate --live live.json -o json > second.json
          events=$(jq '.events | length' second.json)
          test "$events" -eq 0 || { echo "a repeat scan produced $events events"; cat second.json; exit 1; }

          # Fixing a finding produces a resolved event.
          jq '.resources["aws_s3_bucket.assets"].acl = "private"' live.json > tmp && mv tmp live.json
          ../infractl notify --state terraform.tfstate --live live.json -o json > third.json
          jq -e '[.events[] | select(.kind == "resolved")] | length >= 1' third.json > /dev/null

      - name: Notifications carry no attribute values
        run: |
          cd notifytest
          ../infractl notify --state terraform.tfstate --live live.json --no-save -o json > payload.json
          if grep -q 'correct-horse-battery-staple' payload.json; then
            echo 'a sensitive value reached a notification payload'
            exit 1
          fi

      - name: State parsing
        run: |
          ./infractl state inspect testdata/terraform.tfstate
          test "$(./infractl state list testdata/terraform.tfstate -o name | wc -l)" -eq 5

      - name: Drift detection finds the seeded drift
        run: |
          ./infractl drift scan \
            --state testdata/terraform.tfstate \
            --live testdata/live.json -o json > drift.json

          findings=$(jq '.findings | length' drift.json)
          test "$findings" -eq 4 || (echo "expected 4 findings, got $findings" && exit 1)

          critical=$(jq -r '.counts_by_severity.critical' drift.json)
          test "$critical" -eq 1 || (echo "expected 1 critical, got $critical" && exit 1)

      - name: Exit code 3 signals findings, not failure
        run: |
          set +e
          ./infractl drift scan --state testdata/terraform.tfstate \
            --live testdata/live.json --fail-on high --quiet -o json > /dev/null
          code=$?
          set -e
          test "$code" -eq 3 || (echo "expected exit 3, got $code" && exit 1)

      - name: Exit code 0 when nothing is over the threshold
        run: |
          ./infractl drift scan --state testdata/terraform.tfstate \
            --live testdata/live.json --fail-on none --quiet -o json > /dev/null

      - name: Machine output is valid and unstyled
        run: |
          ./infractl drift scan --state testdata/terraform.tfstate \
            --live testdata/live.json --color always -o json | jq -e . > /dev/null
          ./infractl state inspect testdata/terraform.tfstate --color always -o json \
            | grep -qP '\x1b' && (echo "ANSI escapes leaked into JSON output" && exit 1) || true

      - name: Secrets never reach the payload
        run: |
          ./infractl state show testdata/terraform.tfstate aws_db_instance.primary -o json \
            > shown.json
          if grep -q "correct-horse-battery-staple" shown.json; then
            echo "a sensitive value leaked into JSON output"
            exit 1
          fi
          jq -e '.attributes.password == "(sensitive value hidden)"' shown.json > /dev/null

      - name: Blast radius reaches transitive dependents
        run: |
          ./infractl graph blast-radius aws_vpc.main \
            --state testdata/terraform.tfstate -o json > blast.json
          affected=$(jq '.total_affected' blast.json)
          test "$affected" -eq 3 || (echo "expected 3 affected, got $affected" && exit 1)

      - name: Output is deterministic across runs
        run: |
          for i in 1 2 3; do
            ./infractl drift scan --state testdata/terraform.tfstate \
              --live testdata/live.json -o json | jq -S 'del(.scanned_at)' > "run$i.json"
          done
          diff run1.json run2.json
          diff run2.json run3.json

      - name: Ignore rules suppress, and say what they suppressed
        run: |
          ./infractl drift scan --state testdata/terraform.tfstate             --live testdata/live.json             --ignore-file testdata/.infractl-ignore.yaml -o json > ignored.json

          kept=$(jq '.findings | length' ignored.json)
          test "$kept" -eq 3 || (echo "expected 3 findings after suppression, got $kept" && exit 1)

          hidden=$(jq '.suppressed' ignored.json)
          test "$hidden" -eq 1 || (echo "expected 1 suppressed, got $hidden" && exit 1)

          # Suppression is never silent: the rule that fired must be named.
          jq -e '.suppressed_by | length == 1' ignored.json > /dev/null

          # --no-ignore restores everything, which is how an audit sees what is hidden.
          all=$(./infractl drift scan --state testdata/terraform.tfstate             --live testdata/live.json --ignore-file testdata/.infractl-ignore.yaml             --no-ignore -o json | jq '.findings | length')
          test "$all" -eq 4 || (echo "expected 4 findings with --no-ignore, got $all" && exit 1)

      - name: SARIF output is valid and uploadable
        run: |
          ./infractl drift scan --state testdata/terraform.tfstate             --live testdata/live.json -o sarif > drift.sarif

          jq -e '.version == "2.1.0"' drift.sarif > /dev/null
          jq -e '.runs[0].tool.driver.name == "infractl"' drift.sarif > /dev/null

          # GitHub rejects an upload whose results carry no location or whose
          # rules array is null, so both are asserted here rather than found
          # at upload time.
          jq -e '.runs[0].tool.driver.rules | type == "array"' drift.sarif > /dev/null
          jq -e '[.runs[0].results[] | select((.locations | length) == 0)] | length == 0' drift.sarif > /dev/null
          jq -e '[.runs[0].results[] | select(.level | IN("error","warning","note","none") | not)] | length == 0' drift.sarif > /dev/null

      - name: Every output format renders
        run: |
          for format in table wide json yaml csv tsv name; do
            ./infractl state list testdata/terraform.tfstate -o "$format" > /dev/null \
              || (echo "format $format failed" && exit 1)
          done
          ./infractl state list testdata/terraform.tfstate \
            -o go-template='{{range .}}{{.Address}}{{"\n"}}{{end}}' > /dev/null

          # SARIF is deliberately absent from that loop. A command with no
          # SARIF representation must refuse rather than emit an empty
          # document, because an empty SARIF upload tells GitHub that every
          # previously reported finding has been fixed.
          if ./infractl state list testdata/terraform.tfstate -o sarif > /dev/null 2>&1; then
            echo "state list should refuse SARIF, but succeeded"
            exit 1
          fi
