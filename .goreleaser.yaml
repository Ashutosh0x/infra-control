version: 2

project_name: infra-control

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: infractl
    main: ./cmd/infractl
    binary: infractl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ashutosh0x/infra-control/pkg/version.Version={{.Version}} -X github.com/ashutosh0x/infra-control/pkg/version.Commit={{.ShortCommit}} -X github.com/ashutosh0x/infra-control/pkg/version.BuildDate={{.Date}}

  - id: controller
    main: ./cmd/controller
    binary: controller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ashutosh0x/infra-control/pkg/version.Version={{.Version}} -X github.com/ashutosh0x/infra-control/pkg/version.Commit={{.ShortCommit}} -X github.com/ashutosh0x/infra-control/pkg/version.BuildDate={{.Date}}

  - id: worker
    main: ./cmd/worker
    binary: worker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ashutosh0x/infra-control/pkg/version.Version={{.Version}} -X github.com/ashutosh0x/infra-control/pkg/version.Commit={{.ShortCommit}} -X github.com/ashutosh0x/infra-control/pkg/version.BuildDate={{.Date}}

  - id: mcp-server
    main: ./cmd/mcp-server
    binary: mcp-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ashutosh0x/infra-control/pkg/version.Version={{.Version}} -X github.com/ashutosh0x/infra-control/pkg/version.Commit={{.ShortCommit}} -X github.com/ashutosh0x/infra-control/pkg/version.BuildDate={{.Date}}

archives:
  # The CLI ships on its own. It is what people install, and Homebrew, Scoop,
  # and the install instructions all reference this archive by id.
  - id: infractl
    ids: [infractl]
    formats: [tar.gz]
    name_template: >-
      infractl_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

  # The control-plane binaries ship separately and are named so, because they
  # are skeletons. Bundling them with the CLI would put a binary that does not
  # run into the archive people install to get one that does.
  - id: server
    ids: [controller, worker, mcp-server]
    formats: [tar.gz]
    name_template: >-
      infra-control-server_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Package manager distribution. A tool nobody can install does not get adopted,
# and asking people to curl a tarball is a step most will not take.
homebrew_casks:
  - name: infractl
    repository:
      owner: Ashutosh0x
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/Ashutosh0x/infra-control
    description: Detect Terraform drift, score risk, and map blast radius, with no server and no cloud credentials
    license: Apache-2.0
    # Only the CLI is published. The server components are skeletons, and
    # shipping them would imply they run.
    ids: [infractl]
    url:
      verified: github.com/Ashutosh0x/infra-control
    # Homebrew is opt-in until the tap repository exists. Set PUBLISH_TAPS to
    # any non-empty value on a release to push the cask; without it a release
    # succeeds and simply skips this step, rather than failing at the end of a
    # build that otherwise worked.
    skip_upload: '{{ if eq (envOrDefault "PUBLISH_TAPS" "") "" }}true{{ else }}false{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/infractl"]
          end

scoops:
  - name: infractl
    repository:
      owner: Ashutosh0x
      name: scoop-bucket
    homepage: https://github.com/Ashutosh0x/infra-control
    description: Detect Terraform drift, score risk, and map blast radius, with no server and no cloud credentials
    license: Apache-2.0
    ids: [infractl]
    skip_upload: '{{ if eq (envOrDefault "PUBLISH_TAPS" "") "" }}true{{ else }}false{{ end }}'

dockers_v2:
  - ids: [infractl]
    images:
      - "ghcr.io/ashutosh0x/infractl"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: deployments/docker/Dockerfile.cli
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: infractl
      org.opencontainers.image.description: Terraform drift detection, risk scoring, and blast radius
      org.opencontainers.image.source: https://github.com/Ashutosh0x/infra-control
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

release:
  footer: |
    ## Install

    ```bash
    # Homebrew
    brew install Ashutosh0x/tap/infractl

    # Scoop
    scoop bucket add ashutosh0x https://github.com/Ashutosh0x/scoop-bucket
    scoop install infractl

    # Go
    go install github.com/ashutosh0x/infra-control/cmd/infractl@{{ .Tag }}

    # Docker
    docker run --rm -v "$PWD:/work" -w /work ghcr.io/ashutosh0x/infractl:{{ .Version }}       drift scan --state terraform.tfstate --live live.json
    ```
