version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - revive
    - misspell
    - prealloc

  settings:
    govet:
      enable:
        # Replaces the deprecated check-shadowing option.
        - shadow
    misspell:
      locale: UK

  exclusions:
    rules:
      # Test files legitimately ignore errors from helpers whose failure the
      # assertion itself would catch.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
