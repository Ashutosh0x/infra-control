name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: If it is a command or flag, show the invocation you would want to type.
      render: shell
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: The workaround, or the other tool you reach for.

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be done from a state, plan, or snapshot file, with no cloud credentials
        - label: This needs live cloud API access
        - label: I would be willing to work on this
