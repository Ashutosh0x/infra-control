project_name: infra-control

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: infractl
    main: ./cmd/infractl
    binary: infractl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ashutosh0x/infra-control/pkg/version.Version={{.Version}} -X github.com/ashutosh0x/infra-control/pkg/version.Commit={{.Commit}} -X github.com/ashutosh0x/infra-control/pkg/version.BuildDate={{.Date}}

  - id: controller
    main: ./cmd/controller
    binary: controller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ashutosh0x/infra-control/pkg/version.Version={{.Version}} -X github.com/ashutosh0x/infra-control/pkg/version.Commit={{.Commit}} -X github.com/ashutosh0x/infra-control/pkg/version.BuildDate={{.Date}}

  - id: worker
    main: ./cmd/worker
    binary: worker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ashutosh0x/infra-control/pkg/version.Version={{.Version}} -X github.com/ashutosh0x/infra-control/pkg/version.Commit={{.Commit}} -X github.com/ashutosh0x/infra-control/pkg/version.BuildDate={{.Date}}

  - id: mcp-server
    main: ./cmd/mcp-server
    binary: mcp-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ashutosh0x/infra-control/pkg/version.Version={{.Version}} -X github.com/ashutosh0x/infra-control/pkg/version.Commit={{.Commit}} -X github.com/ashutosh0x/infra-control/pkg/version.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
