name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the changelog from history, which a shallow
          # clone does not carry.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test before releasing
        run: go test ./...

      # Multi-arch images need buildx; ghcr needs a login. Both are skipped
      # harmlessly if the Docker step is not reached.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew and Scoop publishing is opt-in: it needs a token with
          # write access to the tap repositories, which the default
          # GITHUB_TOKEN does not have. Set PUBLISH_TAPS and TAP_GITHUB_TOKEN
          # once those repositories exist, and the same release job starts
          # pushing to them. Until then a release succeeds and skips the step,
          # rather than failing after everything else worked.
          PUBLISH_TAPS: ${{ vars.PUBLISH_TAPS }}
